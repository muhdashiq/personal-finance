# Supabase CLI configuration for local development (`supabase start`).
# Production settings are managed in the Supabase dashboard.
project_id = "family-finance"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "familyfinance://"
additional_redirect_urls = [
  "familyfinance://auth-callback",
  "familyfinance://sign-in",
  "exp://127.0.0.1:8081/--/auth-callback",
  "http://localhost:8081/auth-callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.sms]
enable_signup = false

# Google: create OAuth credentials (Web client) and set the env vars below.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Apple: client_id is the Services ID (web/Android) and/or the iOS bundle id
# for native Sign in with Apple; secret is the generated client secret JWT.
[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[functions.send-invitation]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
